name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.12.2'
          cabal-version: '3.14.2.0'
      - run: cabal update
      - run: ./scripts/test-portable.sh
      - name: Check the tag names this version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' native/Info.plist)"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || {
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version}" >&2; exit 1; }
      # Without a Developer ID the bundle is ad-hoc signed and Gatekeeper asks
      # the user to approve it once.
      - name: Import the Developer ID
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        if: env.CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/id.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Package
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./scripts/package.sh
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on=1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > build/release/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: XMonadMac
          path: build/release/*.zip
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/release/*.zip \
            --title "XMonadMac ${GITHUB_REF_NAME#v}" --notes-file build/release/notes.md
